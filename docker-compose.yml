services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - auth-mongo
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://auth-mongo:27017
      - KEYS_DIR=/app/keys
    volumes:
      - auth-service-keys:/app/keys
    ports:
      - "8100:8000"
    networks:
      - app

  auth-mongo:
    image: mongo:7
    container_name: auth-mongo
    restart: unless-stopped
    # Exposed to the host for local inspection (e.g. MongoDB Compass) —
    # 27017 is taken by RAGulate's own mongodb container on this machine, so
    # this uses 27018 on the host; the container itself still listens on the
    # standard 27017 internally. No auth configured — fine for local dev
    # only, don't do this on a shared/production host.
    ports:
      - "27018:27017"
    volumes:
      - auth-mongo-data:/data/db
    networks:
      - app

volumes:
  auth-service-keys:
  auth-mongo-data:

networks:
  app:
